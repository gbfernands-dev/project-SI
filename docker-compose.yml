services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: godzilla
      POSTGRES_USER: godzilla
      POSTGRES_PASSWORD: godzilla
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godzilla -d godzilla"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://godzilla:godzilla@db:5432/godzilla
      SECRET_KEY: desenvolvimento-local-nao-use-em-producao
      PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
