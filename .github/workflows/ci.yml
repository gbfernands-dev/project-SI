name: quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: ruff check .

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: godzilla
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d godzilla"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/godzilla
      SECRET_KEY: ci-secret
      APP_ENV: development
      PUBLIC_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: alembic upgrade head
      - run: pytest tests/test_auth_and_cart.py tests/test_contract.py tests/test_admin_and_payments.py

  e2e:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret
      APP_ENV: development
      PUBLIC_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest --no-cov tests/e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag loja-atletica-godzilla:ci .

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLIC_SITE_URL != ''
    needs: [lint, backend, e2e, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate deployed health endpoint
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: curl --fail --show-error --retry 8 --retry-delay 15 --retry-all-errors "${PUBLIC_SITE_URL%/}/api/v1/health"
